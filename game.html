<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <nav class="navbar">
    <div class="stats">
      <div class="stat-box">
        <span class="stat-label">Puntos</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Tiradas</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Restantes</span>
        <span class="stat-value" id="remaining">0</span>
      </div>
    </div>
    <div class="player-info">
      <span class="player-name" id="playerName"></span>
      <img class="player-avatar" id="playerAvatar" src="" alt="avatar">
    </div>
  </nav>

  <div id="board"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-subtitle" id="modalSubtitle"></p>
      <button class="modal-btn" onclick="window.location.href='index.html'">
        Volver al inicio
      </button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
