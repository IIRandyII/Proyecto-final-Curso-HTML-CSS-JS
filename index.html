<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>One Piece Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h3 class="Logo">Grand <span class="clash">Clash</span></h3>
    <span class="Game">One piece memory</span>

    <form id="playerForm">
    <!-- NOMBRE -->
    <label>Nombre del jugador</label>
    <input type="text" id="nick" placeholder="Ingresa el nombre del jugador" required>

    <!-- DIFICULTAD -->
    <label>Dificultad</label>
    <div class="difficulty-container" id="difficulty">
      <div class="difficulty-card" data-value="easy">
        <div class="icon">🌊</div>
          <h3>Fácil</h3>
          <p>10 seg • 30 tiradas</p>
    </div>

  <div class="difficulty-card" data-value="medium">
    <div class="icon">⚔️</div>
    <h3>Medio</h3>
    <p>5 seg • 20 tiradas</p>
  </div>

  <div class="difficulty-card" data-value="hard">
    <div class="icon">💀</div>
    <h3>Difícil</h3>
    <p>2 seg • 12 tiradas</p>
  </div>

</div>

    <!-- CARTAS -->
    <label>Número de cartas</label>
    <div class="options" id="cards">
      <button type="button" data-value="9">3x3</button>
      <button type="button" data-value="16">4x4</button>
      <button type="button" data-value="25">5x5</button>
    </div>

    <!-- AVATAR -->
    <label>Elige tu avatar</label>
    <div class="avatars" id="avatar">
      <img src="img/avatars/avatar-luffy.jpg" data-value="avatar-luffy.jpg">
      <img src="img/avatars/avatar-zoro.jpg" data-value="avatar-zoro.jpg">
    </div>

      <button type="submit" class="play-btn">Jugar</button>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
