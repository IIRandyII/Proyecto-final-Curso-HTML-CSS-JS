<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>One Piece Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <img src="img/grand_clash_logo.png" class="logo">

    <form id="playerForm">
    <!-- NOMBRE -->
    <label>Nombre del jugador</label>
    <input type="text" id="nick" placeholder="Ingresa el nombre del jugador" required>

    <!-- DIFICULTAD -->
    <label>Dificultad</label>
    <div class="options" id="difficulty">
      <button type="button" data-value="easy">Fácil</button>
      <button type="button" data-value="medium">Medio</button>
      <button type="button" data-value="hard">Difícil</button>
    </div>

    <!-- CARTAS -->
    <label>Número de cartas</label>
    <div class="options" id="cards">
      <button type="button" data-value="9">3x3</button>
      <button type="button" data-value="16">4x4</button>
      <button type="button" data-value="25">5x5</button>
    </div>

    <!-- AVATAR -->
    <label>Elige tu avatar</label>
    <div class="avatars" id="avatar">
      <img src="img/avatars/avatar-luffy.jpg" data-value="avatar-luffy.jpg">
      <img src="img/avatars/avatar-zoro.jpg" data-value="avatar-zoro.jpg">
    </div>

      <button type="submit" class="play-btn">Jugar</button>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
